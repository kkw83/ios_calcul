name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Calculator.app and package IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build (unsigned, for AltStore signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Calculator.app"
          test -d "$APP_PATH"

          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/

          cd out
          zip -qry Calculator-unsigned.ipa Payload

          echo "--- IPA contents (top) ---"
          unzip -l Calculator-unsigned.ipa | sed -n '1,20p'
          echo "IPA size: $(du -h Calculator-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-ipa
          path: out/Calculator-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
